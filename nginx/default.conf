server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net https://img.shields.io; font-src 'self'; connect-src 'self' https://unpkg.com; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # These font filenames include their upstream version and are safe to cache.
    location ~* \.(?:ttf|woff2?)$ {
        expires 365d;
    }

    # Portfolio images change infrequently. They are cached for 30 days, but
    # remain revalidatable after that period because their names are not hashed.
    location ~* \.(?:webp|png|jpe?g|gif|svg)$ {
        expires 30d;
    }

    # Generated CSS and JavaScript can change under the same filename, so
    # always validate them before reuse to ensure a new deployment is visible.
    location ~* \.(?:css|js|mjs|pdf)$ {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
